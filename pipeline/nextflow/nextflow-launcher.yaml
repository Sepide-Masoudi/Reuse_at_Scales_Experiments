apiVersion: v1
kind: Pod
metadata:
  name: nextflow-launcher
  namespace: nextflow
spec:
  nodeSelector:
    kubernetes.io/hostname: gisele
  serviceAccountName: nextflow-sa
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nextflow-pvc
  containers:
    - name: nextflow
      image: nextflow/nextflow:25.10.4
      command: ["tail", "-f", "/dev/null"]
      volumeMounts:
        - name: data
          mountPath: /workspace
      env:
        - name: NXF_HOME
          value: /workspace/.nextflow