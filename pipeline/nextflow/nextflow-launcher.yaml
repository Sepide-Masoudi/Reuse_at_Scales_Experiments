apiVersion: v1
kind: Pod
metadata:
  name: nextflow-launcher
  namespace: nextflow
spec:
  nodeSelector:
    kubernetes.io/hostname: gisele
  serviceAccountName: nextflow-sa
  restartPolicy: Always
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nextflow-pvc
  containers:
    - name: nextflow
      image: nextflow/nextflow:25.10.4
      command: ["tail", "-f", "/dev/null"]
      env:
        - name: NXF_HOME
          value: /workspace/.nextflow
        - name: NXF_WORK
          value: /workspace/work
      volumeMounts:
        - name: data
          mountPath: /workspace
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"