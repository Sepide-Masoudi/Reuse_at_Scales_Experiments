apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: featurecounts-service
  namespace: nextflow
  labels:
    pipeline: rnaseq
    reuse: pod-service-knative
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/scale-to-zero-pod-retention-period: "300s"
        serving.knative.dev/drainTimeout: "10s"
        autoscaling.knative.dev/window: "10s"
        autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"
        autoscaling.knative.dev/initial-scale: "1"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "1"
        autoscaling.knative.dev/target: "10"
    spec:
      nodeSelector:
        kubernetes.io/hostname: gisele
      timeoutSeconds: 600
      containerConcurrency: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextflow-pvc
      containers:
        - name: featurecounts
          image: quay.io/biocontainers/stringtie:2.2.3--h43eeafb_0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SERVICE_PORT
              value: "8080"
            - name: PATH
              value: "/shared-bin:/usr/local/bin:/usr/bin:/bin"
            - name: LD_LIBRARY_PATH
              value: "/shared-bin"
          command:
            - sh
            - -c
            - |
              # Copy featureCounts binary from the cached subread image on the PVC
              mkdir -p /shared-bin
              cp /workspace/featurecounts-bin/featureCounts /shared-bin/ 2>/dev/null || \
              find /workspace -name "featureCounts" -exec cp {} /shared-bin/ \; 2>/dev/null || true
              cp /workspace/featurecounts-bin/lib* /shared-bin/ 2>/dev/null || true
              chmod +x /shared-bin/featureCounts 2>/dev/null || true

              # Start the HTTP service
              /usr/local/bin/python3 - << 'PYEOF'
              import os, subprocess, json, logging
              from http.server import HTTPServer, BaseHTTPRequestHandler
              from socketserver import ThreadingMixIn
              from urllib.parse import urlparse

              logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(message)s')
              log = logging.getLogger("featurecounts-service")

              class ThreadingHTTPServer(ThreadingMixIn, HTTPServer):
                  daemon_threads = True

              class FeatureCountsHandler(BaseHTTPRequestHandler):
                  def log_message(self, format, *args):
                      log.info(format % args)

                  def do_GET(self):
                      if urlparse(self.path).path == "/health":
                          self._respond(200, {"status": "ok", "service": "featurecounts"})
                      else:
                          self._respond(404, {"error": "not found"})

                  def do_POST(self):
                      if urlparse(self.path).path != "/run":
                          self._respond(404, {"error": "not found"}); return
                      length = int(self.headers.get("Content-Length", 0))
                      body = self.rfile.read(length)
                      try:
                          req = json.loads(body)
                      except Exception as e:
                          self._respond(400, {"error": f"invalid JSON: {e}"}); return

                      bams=req.get("bams"); annotation=req.get("annotation")
                      outdir=req.get("outdir"); prefix=req.get("prefix")
                      paired_end=req.get("paired_end", True)
                      strandedness=req.get("strandedness", 0)
                      cpus=req.get("cpus", 2); args=req.get("args", "")

                      if not all([bams, annotation, outdir, prefix]):
                          self._respond(400, {"error": "missing required fields"}); return

                      os.makedirs(outdir, exist_ok=True)
                      output_file = os.path.join(outdir, f"{prefix}.featureCounts.tsv")
                      summary_file = f"{output_file}.summary"
                      paired_flag = "-p" if paired_end else ""

                      cmd = ["featureCounts", *args.split(), paired_flag, "-T", str(cpus),
                             "-a", annotation, "-s", str(strandedness), "-o", output_file, *bams]
                      cmd = [c for c in cmd if c]
                      log.info(f"Running featureCounts for {prefix}")

                      try:
                          result = subprocess.run(cmd, capture_output=True, text=True, timeout=3600)
                      except Exception as e:
                          self._respond(500, {"error": str(e)}); return

                      if result.returncode != 0:
                          self._respond(500, {"error": "featureCounts failed", "stderr": result.stderr}); return

                      log.info(f"featureCounts completed for {prefix}")
                      self._respond(200, {"status": "success", "prefix": prefix,
                                          "counts": output_file, "summary": summary_file})

                  def _respond(self, code, data):
                      body = json.dumps(data).encode()
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", len(body))
                      self.end_headers()
                      self.wfile.write(body)

              import signal, threading
              port = int(os.environ.get("SERVICE_PORT", 8080))
              server = ThreadingHTTPServer(("0.0.0.0", port), FeatureCountsHandler)
              log.info(f"featureCounts Knative service on port {port} (scale-to-zero)")
              def shutdown(signum, frame):
                  log.info("SIGTERM received, shutting down")
                  t = threading.Thread(target=server.shutdown)
                  t.daemon = True
                  t.start()
              signal.signal(signal.SIGTERM, shutdown)
              signal.signal(signal.SIGINT, shutdown)
              server.serve_forever()
              PYEOF
          volumeMounts:
            - name: data
              mountPath: /workspace
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "4Gi"