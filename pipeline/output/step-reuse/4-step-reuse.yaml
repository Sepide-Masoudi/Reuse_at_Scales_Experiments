apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: parallel-full-data-pipeline
  namespace: pipeline
spec:
  entrypoint: parallel-full-data-pipeline
  serviceAccountName: argo-workflow-sa
  nodeSelector:
    baremetal: "true"
  volumes:
  - name: shared-data
    persistentVolumeClaim:
      claimName: argo-shard-pvc
  - name: temp-volume
    emptyDir:
      sizeLimit: 1Gi
      
  templates:
  - name: parallel-full-data-pipeline
    steps:
    - - name: generate-name
        template: generate-name-parallel-full-data-pipeline
      - name: generate-birthday
        template: generate-birthday-parallel-full-data-pipeline
      - name: generate-address
        template: generate-address-parallel-full-data-pipeline
    - - name: generate-id
        template: generate-id-parallel-full-data-pipeline
    - - name: data-preprocess
        template: call-data-preprocess-service
    - - name: synthetic-generator
        template: call-synthetic-generator-service
    - - name: privacy-tracking
        template: call-privacy-tracking-service
      - name: data-quality
        template: call-data-quality-service

  - name: generate-name-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "generate-name"
        workflow-name: "4-step-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-generate-names:latest
      command: ["python","main.py"]
      args: ["--n_rows","1000","--mf_ratio","0.5","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-name/names.csv"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
          ephemeral-storage: "200Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "500Mi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

  - name: generate-birthday-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "generate-birthday"
        workflow-name: "4-step-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-generate-birthday:latest
      command: ["python","main.py"]
      args: ["--n_rows","1000","--min_age","18","--max_age","80","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-birthday/birthdays.csv"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
          ephemeral-storage: "200Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "500Mi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

  - name: generate-address-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "generate-address"
        workflow-name: "4-step-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-generate-address:latest
      command: ["python","main.py"]
      args: ["--n_rows","1000","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-address/addresses.csv"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
          ephemeral-storage: "200Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "500Mi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

  - name: generate-id-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "generate-id"
        workflow-name: "4-step-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-generate-id-code:latest
      command: ["python","main.py"]
      args: ["--name_csv","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-name/names.csv","--birthday_csv","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-birthday/birthdays.csv","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-id/id_data.csv"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
          ephemeral-storage: "300Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

  - name: call-data-preprocess-service
    metadata:
      labels:
        step-name: "data-preprocess"
        workflow-name: "4-step-reuse-parallel-full-data-pipeline"  
    container:
      image: curlimages/curl:7.85.0
      command:
      - curl
      - -X
      - POST
      - http://data-preprocess-knative.pipeline.svc.cluster.local/run
#      - http://data-preprocess.pipeline.svc.cluster.local:8083/run
      - -F
      - metadata_file=/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/metadata.json
      - -F
      - input_file=/mnt/data/argo-shard/parallel-full-data-pipeline-generate-id/id_data.csv
      - -F
      - output_file=/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/clean_data.csv
      - -F
      - handle_missing=mean
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data
  - name: call-synthetic-generator-service
    metadata:
      labels:
        step-name: "synthetic-generator"
        workflow-name: "4-step-reuse-parallel-full-data-pipeline"  
    container:
      image: curlimages/curl:7.85.0
      command:
      - curl
      - -X
      - POST
      - http://synthetic-generator-knative.pipeline.svc.cluster.local/run
#      - http://synthetic-generator.pipeline.svc.cluster.local:8090/run
      - -F
      - metadata_json=/mnt/data/argo-shard/parallel-full-data-pipelinedata-preprocess/metadata.json
      - -F
      - input_csv=clean_data.csv
      - -F
      - input_dir=/mnt/data/argo-shard/parallel-full-data-pipelinedata-preprocess
      - -F
      - output_file=/mnt/data/argo-shard/parallel-full-data-pipelinesynthetic-generator/synthetic_data.csv
      - -F
      - n_rows=1000
      - -F
      - method=realistic
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data
  - name: call-data-quality-service
    metadata:
      labels:
        step-name: "data-quality"
        workflow-name: "4-step-reuse-parallel-full-data-pipeline"  
    container:
      image: curlimages/curl:7.85.0
      command:
      - curl
      - -X
      - POST
      - http://data-quality-knative.pipeline.svc.cluster.local/run
#      - http://data-quality.pipeline.svc.cluster.local:8084/run      
      - -F
      - input_metadata_file=/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/metadata.json
      - -F
      - input_file_real=/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/clean_data.csv
      - -F
      - input_file_synth=/mnt/data/argo-shard/parallel-full-data-pipeline-synthetic-generator/synthetic_data.csv
      - -F
      - output_dir=/mnt/data/argo-shard/parallel-full-data-pipeline-data-quality
      - -F
      - metrics=realistic
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data
  - name: call-privacy-tracking-service
    metadata:
      labels:
        step-name: "privacy-tracking"
        workflow-name: "4-step-reuse-parallel-full-data-pipeline"    
    container:
      image: curlimages/curl:7.85.0
      command:
      - curl
      - -X
      - POST
      - http://privacy-tracking-knative.pipeline.svc.cluster.local/run
#      - http://privacy-tracking.pipeline.svc.cluster.local:8089/run
      - -F
      - input_dir=/mnt/data/argo-shard
      - -F
      - real_csv=parallel-full-data-pipelinedata-preprocess/clean_data.csv
      - -F
      - synth_csv=parallel-full-data-pipelinesynthetic-generator/synthetic_data.csv
      - -F
      - output_file=/mnt/data/argo-shard/parallel-full-data-pipeline-privacy-tracking/privacy_report.json
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data
