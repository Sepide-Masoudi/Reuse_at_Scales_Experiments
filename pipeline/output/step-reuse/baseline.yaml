apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: parallel-full-data-pipeline
  namespace: pipeline
spec:
  entrypoint: parallel-full-data-pipeline
  serviceAccountName: argo-workflow-sa
  nodeSelector:
    baremetal: "true"
  volumes:
  - name: shared-data
    persistentVolumeClaim:
      claimName: argo-shard-pvc
  - name: temp-volume
    emptyDir:
      sizeLimit: 1Gi
      
  templates:
  - name: parallel-full-data-pipeline
    steps:
    - - name: generate-name
        template: generate-name-parallel-full-data-pipeline
    - - name: generate-birthday
        template: generate-birthday-parallel-full-data-pipeline
    - - name: generate-address
        template: generate-address-parallel-full-data-pipeline
    - - name: generate-id
        template: generate-id-parallel-full-data-pipeline
    - - name: data-preprocess
        template: data-preprocess-parallel-full-data-pipeline
    - - name: synthetic-generator
        template: synthetic-generator-parallel-full-data-pipeline
    - - name: privacy-tracking
        template: privacy-tracking-parallel-full-data-pipeline
    - - name: data-quality
        template: data-quality-parallel-full-data-pipeline


  - name: generate-name-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "generate-name"
        workflow-name: "no-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-generate-names:latest
      command: ["python","main.py"]
      args: ["--n_rows","1000","--mf_ratio","0.5","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-name/names.csv"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
          ephemeral-storage: "200Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "500Mi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

  - name: generate-birthday-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "generate-birthday"
        workflow-name: "no-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-generate-birthday:latest
      command: ["python","main.py"]
      args: ["--n_rows","1000","--min_age","18","--max_age","80","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-birthday/birthdays.csv"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
          ephemeral-storage: "200Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "500Mi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

  - name: generate-address-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "generate-address"
        workflow-name: "no-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-generate-address:latest
      command: ["python","main.py"]
      args: ["--n_rows","1000","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-address/addresses.csv"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
          ephemeral-storage: "200Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "500Mi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

  - name: generate-id-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "generate-id"
        workflow-name: "no-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-generate-id-code:latest
      command: ["python","main.py"]
      args: ["--name_csv","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-name/names.csv","--birthday_csv","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-birthday/birthdays.csv","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-id/id_data.csv"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
          ephemeral-storage: "300Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

  - name: data-preprocess-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "data-preprocess"
        workflow-name: "no-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-data-preprocessor:latest
      command: ["python","main.py"]
      args: ["--input_path","/mnt/data/argo-shard/parallel-full-data-pipeline-generate-id/id_data.csv","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/clean_data.csv","--metadata_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/metadata.json","--handle_missing","mean"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
          ephemeral-storage: "300Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

  - name: synthetic-generator-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "synthetic-generator"
        workflow-name: "no-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-synthetic-generator:latest
      command: ["python","main.py"]
      args: ["--metadata_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/metadata.json","--input_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/clean_data.csv","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-synthetic-generator/synthetic_data.csv","--num_samples","1000"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
        limits:
          cpu: "500m"
          memory: "1Gi"
          ephemeral-storage: "1Gi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

  - name: data-quality-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "data-quality"
        workflow-name: "no-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-data-quality:latest
      command: ["python","main.py"]
      args: ["--metadata_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/metadata.json","--real_data_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/clean_data.csv","--synthetic_data_path","/mnt/data/argo-shard/parallel-full-data-pipeline-synthetic-generator/synthetic_data.csv","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-quality/quality_report.json","--method","realistic","--output_dir","/mnt/data/argo-shard/parallel-full-data-pipeline-data-quality/quality_report_HTML.html"]      
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
            requests:
              cpu: "100m"
              memory: "768Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "200Mi"      
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp
        subPath: tmp


  - name: privacy-tracking-parallel-full-data-pipeline
    metadata:
      labels:
        step-name: "privacy-tracking"
        workflow-name: "no-reuse-parallel-full-data-pipeline"
    container:
      image: sepidmas/noreuse_scale-privacy-tracking:latest
      command: ["python","main.py"]
      args: ["--real_data_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/clean_data.csv","--synthetic_data_path","/mnt/data/argo-shard/parallel-full-data-pipeline-synthetic-generator/synthetic_data.csv","--output_path","/mnt/data/argo-shard/parallel-full-data-pipeline-privacy-tracking/privacy_report.json"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "768Mi"
          ephemeral-storage: "500Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
          ephemeral-storage: "1Gi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp