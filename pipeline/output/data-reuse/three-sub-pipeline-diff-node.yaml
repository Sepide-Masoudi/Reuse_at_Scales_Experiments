  - name: data-quality-evaluation-only
    metadata:
      labels:
        step-name: "data-quality"
        workflow-name: "evaluation-only"
    container:
      image: sepidmas/noreuse_scale-data-quality:cpu-burn
      command: ["python","main.py"]
      args: ["--cpu_burn_seconds","60","--metadata_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/metadata.json","--real_data_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/clean_data.csv","--synthetic_data_path","/mnt/data/argo-shard/synthetic-generator-only-synthetic-generator/synthetic_data.csv","--output_path","/mnt/data/argo-shard/evaluation-only-data-quality/quality_report.json","--method","realistic","--output_dir","/mnt/data/argo-shard/evaluation-only-data-quality/quality_report_HTML.html"]      
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
            requests:
              cpu: "100m"
              memory: "768Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "200Mi"      
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp
        subPath: tmp


  - name: privacy-tracking-evaluation-only
    metadata:
      labels:
        step-name: "privacy-tracking"
        workflow-name: "evaluation-only"
    container:
      image: sepidmas/noreuse_scale-privacy-tracking:cpu-burn
      command: ["python","main.py"]
      args: ["--cpu_burn_seconds","60","--real_data_path","/mnt/data/argo-shard/parallel-full-data-pipeline-data-preprocess/clean_data.csv","--synthetic_data_path","/mnt/data/argo-shard/synthetic-generator-only-synthetic-generator/synthetic_data.csv","--output_path","/mnt/data/argo-shard/evaluation-only-privacy-tracking/privacy_report.json"]
      env:
      - name: TMPDIR
        value: /tmp
      - name: TEMP
        value: /tmp
      - name: TMP
        value: /tmp
      resources:
        requests:
          cpu: "100m"
          memory: "768Mi"
          ephemeral-storage: "500Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
          ephemeral-storage: "1Gi"
      volumeMounts:
      - name: shared-data
        mountPath: /mnt/data/argo-shard
      - name: temp-volume
        mountPath: /tmp

