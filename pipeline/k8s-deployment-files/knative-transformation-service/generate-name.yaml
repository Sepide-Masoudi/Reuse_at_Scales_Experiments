apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: generate-name-knative
  namespace: pipeline
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/maxScale: "3"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/target: "1"
    spec:
      nodeSelector:
        baremetal: "true"
      containers:
        - name: generate-name-knative
          image: sepidmas/reuse_scale-generate-names:knative
          imagePullPolicy: Always
          ports:
            - containerPort: 8082          
          volumeMounts:
            - name: argo-shard
              mountPath: /mnt/data/argo-shard
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: argo-shard
          persistentVolumeClaim:
            claimName: argo-shard-pvc
