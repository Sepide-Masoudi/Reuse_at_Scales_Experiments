sma:
  version: 0.0.1
  services:
    prometheus:
      address: http://130.149.158.132:32426
  observation:
    mode: trigger
    window:
      left: 10s
      right: 10s
    targets:
      - name: reuse
        namespace: pipeline
      - name: no-reuse
        namespace: no-reuse-pipeline
  measurements:
    ######### system + kepler metrics #########
    - system_cpu_usage:
        type: aggregate
        layer: pod
        query: |
          sum by (pod) (
            rate(container_cpu_usage_seconds_total{
              namespace="${namespace}", container!="", image!=""
            }[2m])
          )
        unit: cpu_cores
        step: 30
        target:
          - reuse

    - kepler_pod_cpu_power_watts:
        type: aggregate
        layer: pod
        query: |
          sum by (pod_name) (
            rate(kepler_pod_cpu_joules_total{
              pod_namespace="${namespace}"
            }[2m])
          )
        unit: watts
        step: 30
        target:
          - reuse

    - kepler_pod_cpu_energy_joules:
        type: aggregate
        layer: pod
        query: |
          sum by (pod_name) (
            increase(kepler_pod_cpu_joules_total{
              pod_namespace="${namespace}"
            }[5m])
          )
        unit: joules
        step: 30
        target:
          - reuse

    - cpu_usage_seconds_delta:
        type: aggregate
        layer: pod
        query: |
          sum by (pod) (
            increase(container_cpu_usage_seconds_total{
              namespace="${namespace}", container!="", image!=""
            }[5m])
          )
        unit: cpu_seconds
        step: 30
        target:
          - reuse

    - kepler_all_pod_cpu_power_watts:
        type: aggregate
        layer: cluster
        query: |
          sum(
            rate(kepler_pod_cpu_joules_total{
              pod_namespace="${namespace}"
            }[2m])
          )
        unit: watts
        step: 30
        target:
          - reuse

    - kepler_all_pod_cpu_energy_joules:
        type: aggregate
        layer: cluster
        query: |
          sum(
            increase(kepler_pod_cpu_joules_total{
              pod_namespace="${namespace}"
            }[5m])
          )
        unit: joules
        step: 30
        target:
          - reuse

    - kepler_node_cpu_power_raw:
        type: raw
        layer: node
        query: |
          rate(kepler_node_cpu_joules_total[2m])
        unit: watts
        step: 30
        target:
          - reuse

    - kepler_node_cpu_power_sum:
        type: aggregate
        layer: cluster
        query: |
          sum(rate(kepler_node_cpu_joules_total[2m]))
        unit: watts
        step: 30
        target:
          - reuse

    - wall_power:
        type: raw
        layer: cluster
        query: shelly_apower_watts
        unit: watts
        step: 30
        target:
          - reuse

    - apiserver_request_rate:
        type: aggregate
        layer: cluster
        query: |
          sum(rate(apiserver_request_total[2m]))
        unit: requests_per_second
        step: 30
        target:
          - reuse

    - apiserver_latency_95th:
        type: aggregate
        layer: cluster
        query: |
          histogram_quantile(
            0.95,
            sum(
              rate(apiserver_request_duration_seconds_bucket[2m])
            ) by (le)
          )
        unit: seconds
        step: 30
        target:
          - reuse

    - pod_memory_usage:
        type: aggregate
        layer: pod
        query: |
          sum by (pod) (
            container_memory_usage_bytes{
              namespace="${namespace}", container!="", image!=""
            }
          )
        unit: bytes
        step: 30
        target:
          - reuse

    - pod_network_receive_bytes:
        type: aggregate
        layer: pod
        query: |
          sum by (pod) (
            rate(container_network_receive_bytes_total{
              namespace="${namespace}"
            }[2m])
          )
        unit: bytes_per_second
        step: 30
        target:
          - reuse

    - pod_network_transmit_bytes:
        type: aggregate
        layer: pod
        query: |
          sum by (pod) (
            rate(container_network_transmit_bytes_total{
              namespace="${namespace}"
            }[2m])
          )
        unit: bytes_per_second
        step: 30
        target:
          - reuse

    ######### argo metrics ###########
    - argo_workflows_total_created:
        type: aggregate
        layer: workflow
        query: |
          sum(
            increase(argo_workflows_total_count{
              namespace="${namespace}"
            }[5m])
          )
        unit: workflows
        step: 30
        target:
          - reuse

    - argo_workflows_error_count:
        type: aggregate
        layer: workflow
        query: |
          sum(
            increase(argo_workflows_error_count{
              namespace="${namespace}"
            }[5m])
          )
        unit: errors
        step: 30
        target:
          - reuse

    - argo_workflows_operation_duration_p95:
        type: aggregate
        layer: workflow
        query: |
          histogram_quantile(
            0.95,
            sum(
              rate(argo_workflows_operation_duration_seconds_bucket{
                namespace="${namespace}"
              }[2m])
            ) by (le)
          )
        unit: seconds
        step: 30
        target:
          - reuse

    - argo_workflows_completed_by_phase:
        type: aggregate
        layer: workflow
        query: |
          sum by (phase) (
            increase(argo_workflows_total_count{
              namespace="${namespace}"
            }[5m])
          )
        unit: workflows
        step: 30
        target:
          - reuse

    - argo_workflows_pods_created:
        type: aggregate
        layer: pod
        query: |
          sum(
            increase(argo_workflows_pods_total_count{
              namespace="${namespace}"
            }[5m])
          )
        unit: pods
        step: 30
        target:
          - reuse

    - argo_workflows_average_queue_latency:
        type: aggregate
        layer: workflow
        query: |
          rate(argo_workflows_queue_latency_sum{
            namespace="${namespace}"
          }[2m])
          /
          rate(argo_workflows_queue_latency_count{
            namespace="${namespace}"
          }[2m])
        unit: seconds
        step: 30
        target:
          - reuse

    - argo_workflows_workers_busy:
        type: raw
        layer: workflow
        query: |
          argo_workflows_workers_busy_count{
            namespace="${namespace}"
          }
        unit: workers
        step: 30
        target:
          - reuse

    - argo_workflows_queue_adds_rate:
        type: aggregate
        layer: workflow
        query: |
          sum(
            rate(argo_workflows_queue_adds_count{
              namespace="${namespace}"
            }[2m])
          )
        unit: workflows_per_second
        step: 30
        target:
          - reuse

    - argo_workflows_k8s_requests_rate:
        type: aggregate
        layer: workflow
        query: |
          sum(
            rate(argo_workflows_k8s_request_total{
              namespace="${namespace}"
            }[2m])
          )
        unit: requests_per_second
        step: 30
        target:
          - reuse

  report:
    format: csv
    location: data/step_reuse_1000_baremetal_${startTime}_${runHash}
    filename: "${name}_${run}.csv"
