---
apiVersion: v1
kind: ConfigMap
metadata:
  name: featurecounts-service-script
  namespace: nextflow
data:
  featurecounts_service.py: |
    #!/usr/bin/env python3
    import os, subprocess, json, logging
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from socketserver import ThreadingMixIn
    from urllib.parse import urlparse

    logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(message)s')
    log = logging.getLogger("featurecounts-service")

    class ThreadingHTTPServer(ThreadingMixIn, HTTPServer):
        daemon_threads = True

    class FeatureCountsHandler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            log.info(format % args)

        def do_GET(self):
            if urlparse(self.path).path == "/health":
                self._respond(200, {"status": "ok", "service": "featurecounts"})
            else:
                self._respond(404, {"error": "not found"})

        def do_POST(self):
            if urlparse(self.path).path != "/run":
                self._respond(404, {"error": "not found"})
                return
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length)
            try:
                req = json.loads(body)
            except Exception as e:
                self._respond(400, {"error": f"invalid JSON: {e}"}); return

            bams         = req.get("bams")
            annotation   = req.get("annotation")
            outdir       = req.get("outdir")
            prefix       = req.get("prefix")
            paired_end   = req.get("paired_end", True)
            strandedness = req.get("strandedness", 0)
            cpus         = req.get("cpus", 2)
            args         = req.get("args", "")

            if not all([bams, annotation, outdir, prefix]):
                self._respond(400, {"error": "missing required fields"}); return

            os.makedirs(outdir, exist_ok=True)
            output_file  = os.path.join(outdir, f"{prefix}.featureCounts.tsv")
            summary_file = f"{output_file}.summary"
            paired_flag  = "-p" if paired_end else ""

            cmd = ["featureCounts", *args.split(), paired_flag, "-T", str(cpus),
                   "-a", annotation, "-s", str(strandedness), "-o", output_file, *bams]
            cmd = [c for c in cmd if c]
            log.info(f"Running featureCounts for {prefix}: {' '.join(cmd)}")

            try:
                result = subprocess.run(cmd, capture_output=True, text=True, timeout=3600)
            except Exception as e:
                self._respond(500, {"error": str(e)}); return

            if result.returncode != 0:
                log.error(f"featureCounts failed for {prefix}: {result.stderr}")
                self._respond(500, {"error": "featureCounts failed", "stderr": result.stderr}); return

            log.info(f"featureCounts completed for {prefix}")
            self._respond(200, {"status": "success", "prefix": prefix,
                                "counts": output_file, "summary": summary_file})

        def _respond(self, code, data):
            body = json.dumps(data).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", len(body))
            self.end_headers()
            self.wfile.write(body)

    if __name__ == "__main__":
        port = int(os.environ.get("SERVICE_PORT", 8080))
        os.environ["PATH"] = "/shared-bin:/usr/local/bin:/usr/bin:/bin:" + os.environ.get("PATH", "")
        os.environ["LD_LIBRARY_PATH"] = "/shared-bin:" + os.environ.get("LD_LIBRARY_PATH", "")
        server = ThreadingHTTPServer(("0.0.0.0", port), FeatureCountsHandler)
        log.info(f"featureCounts service listening on port {port} (threaded, no lock)")
        server.serve_forever()
---
apiVersion: v1
kind: Pod
metadata:
  name: featurecounts-service
  namespace: nextflow
  labels:
    app: featurecounts-service
    pipeline: rnaseq
    reuse: pod-service
spec:
  nodeSelector:
    role: sut
  restartPolicy: Always
  shareProcessNamespace: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nextflow-pvc
    - name: service-script
      configMap:
        name: featurecounts-service-script
    - name: shared-bin
      emptyDir: {}
  initContainers:
    - name: copy-featurecounts
      image: quay.io/biocontainers/subread:2.0.6--he4a0461_2
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          cp $(which featureCounts) /shared-bin/featureCounts
          cp /usr/lib/x86_64-linux-gnu/libz.so.1* /shared-bin/ 2>/dev/null || \
          cp /lib/x86_64-linux-gnu/libz.so.1* /shared-bin/ 2>/dev/null || \
          find / -name "libz.so.1*" -exec cp {} /shared-bin/ \; 2>/dev/null || true
          find / -name "libstdc++.so.6*" -exec cp {} /shared-bin/ \; 2>/dev/null || true
          find / -name "libgomp.so.1*" -exec cp {} /shared-bin/ \; 2>/dev/null || true
          find / -name "libpthread.so.0*" -exec cp {} /shared-bin/ \; 2>/dev/null || true
          ls /shared-bin/
          echo "featureCounts and libs copied"
      volumeMounts:
        - name: shared-bin
          mountPath: /shared-bin
  containers:
    - name: api
      image: quay.io/biocontainers/stringtie:2.2.3--h43eeafb_0
      imagePullPolicy: IfNotPresent
      command: ["python3", "/service/featurecounts_service.py"]
      ports:
        - containerPort: 8080
      env:
        - name: SERVICE_PORT
          value: "8080"
        - name: PATH
          value: "/shared-bin:/usr/local/bin:/usr/bin:/bin"
        - name: LD_LIBRARY_PATH
          value: "/shared-bin"
      volumeMounts:
        - name: data
          mountPath: /workspace
        - name: service-script
          mountPath: /service
        - name: shared-bin
          mountPath: /shared-bin
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: featurecounts-service
  namespace: nextflow
spec:
  selector:
    app: featurecounts-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP